name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# puppeteer is a production dependency; skip its ~150MB Chrome download in CI.
# `next build` never launches it, and the postinstall asset copies (vad + pdf worker)
# only read node_modules, so the browser is not needed here.
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Lint is non-blocking for now: the pre-existing tree has ~760 eslint errors
      # (mostly no-explicit-any). This step surfaces them without failing CI; drop
      # continue-on-error once the debt is cleared and add it to required checks.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage
        run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    env:
      # authService throws at import if this is unset, so the build needs it.
      # Set the repo/org Actions variable NEXT_PUBLIC_API_URL to override the fallback.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://gateway-service-dev-479218009109.asia-south1.run.app' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'ci-placeholder.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload .next build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          if-no-files-found: ignore
